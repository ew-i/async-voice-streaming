[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "async-voice-streamer"
version = "0.1.0"
description = "Asynchronous real-time voice streaming with the ElevenLabs API"
requires-python = ">=3.11"
dependencies = [
    "elevenlabs==2.74.1",
]

[dependency-groups]
dev = [
    "ruff==0.17.2",
]

[tool.hatch.build.targets.wheel]
only-include = ["async_voice_streamer.py"]

[tool.ruff]
# PEP 8 allows teams to agree on up to 99 characters; tool docstrings benefit from it.
line-length = 99
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle: PEP 8 layout, whitespace, line length
    "F",        # pyflakes: unused imports/variables, undefined names
    "N",        # pep8-naming
    "I",        # import order (PEP 8 import grouping)
    "B",        # bugbear: likely bugs
    "UP",       # modern syntax for the minimum Python version
    "SIM",      # simplifications
    "C4",       # comprehension style
]

[tool.ruff.lint.isort]
known-first-party = ["async_voice_streamer"]

[tool.ruff.format]
quote-style = "double"
